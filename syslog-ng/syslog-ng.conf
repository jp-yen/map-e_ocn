@version: 4.27
@include "scl.conf"

# --- Source の定義 ---
source s_local {
    system();
    internal();
    unix-dgram("/run/syslog/log" perm(0666));
};

source s_network {
    udp(ip("0.0.0.0") port(514));
    tcp(ip("0.0.0.0") port(514));
};

source s_docker_stdout {
    udp(ip("0.0.0.0") port(5514));
};

# === PPPoE PER-SERVICE SOURCES START (AUTO-GENERATED) ===
source s_pppoe_unified { unix-dgram("/run/syslog/pppoe-unified.sock" perm(0666)); };
# === PPPoE PER-SERVICE SOURCES END ===

# --- Filter の定義 (プロセス名・Docker tag によるフィルタリング) ---
filter f_mape_server   { program("mape-provisioning-server"); };
filter f_route_monitor { program("mape-route-monitor");       };
filter f_radvd         { program("radvd");                    };
filter f_kea_dhcp6     { program("kea-dhcp6");                };
filter f_kea_hook      { program("kea-map-e-hook");           };
filter f_bind          { program("named") or program("bind9"); };
filter f_pppoe         { program("pppoe-server.*") or program("pppd"); };
filter f_chrony        { program("chrony.*") or program("chronyd"); };
filter f_dashboard     { program("web-dashboard"); };
filter f_not_dashboard { not program("web-dashboard"); };

# レベル判定用フィルタ（syslog優先度およびログ本文のキーワード双方に対応）
filter f_level_debug {
    level(debug) or message("(?i)\\bDEBUG\\b");
};

filter f_level_info {
    (level(info..emerg) or message("(?i)\\b(INFO|NOTICE)\\b"))
    and not message("(?i)\\bDEBUG\\b");
};

filter f_level_warn {
    level(warn..emerg) or message("(?i)\\b(WARN|WARNING|ERROR|ERR|FATAL|CRIT|ALERT|EMERG)\\b");
};

# --- Destination の定義 (出力先の指定: レベル分離対応) ---
destination d_mape_server   { file("/var/log/mape-provisioning-server.log" perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_route_monitor { file("/var/log/mape-route-monitor.log"       perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_radvd         { file("/var/log/radvd.log"                    perm(0666) dir-perm(0777) create-dirs(yes)); };

# Kea DHCPv6: 通常(INFO以上) / 詳細(全レベル・DEBUG含む) / 警告・エラー(WARN以上)
destination d_kea_dhcp6       { file("/var/log/kea/kea-dhcp6.log"            perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_kea_dhcp6_debug { file("/var/log/kea/kea-dhcp6-debug.log"      perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_kea_dhcp6_warn  { file("/var/log/kea/kea-dhcp6-warn.log"       perm(0666) dir-perm(0777) create-dirs(yes)); };

destination d_kea_hook      { file("/var/log/kea/kea-map-e-hook.log"       perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_bind          { file("/var/log/bind.log"                     perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_pppoe            { file("/var/log/pppoe-server.log"             perm(0666) dir-perm(0777) create-dirs(yes)); };
# === PPPoE PER-SERVICE REWRITES & DESTINATIONS START (AUTO-GENERATED) ===
destination d_pppoe_unified { file("/var/log/pppoe/pppoe-server.log" perm(0666) dir-perm(0777) create-dirs(yes)); };
# === PPPoE PER-SERVICE REWRITES & DESTINATIONS END ===
destination d_chrony           { file("/var/log/chrony.log"                   perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_dashboard_access { file("/var/log/web-dashboard-access.log"     perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_messages         { file("/var/log/messages"                     perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_errors           { file("/var/log/errors.log"                   perm(0666) dir-perm(0777) create-dirs(yes)); };
destination d_docker_stdout    { file("/var/log/docker-stdout.log"            perm(0666) dir-perm(0777) create-dirs(yes)); };

# --- Log パス ---
# 1. 各個別サービスログ
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_mape_server);   destination(d_mape_server); };
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_route_monitor); destination(d_route_monitor); };
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_radvd);         destination(d_radvd); };

# Kea DHCPv6: 全件は kea-dhcp6-debug.log へ、INFO以上は通常 kea-dhcp6.log へ、WARN以上は kea-dhcp6-warn.log へ
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_kea_dhcp6); destination(d_kea_dhcp6_debug); };
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_kea_dhcp6); filter(f_level_info); destination(d_kea_dhcp6); };
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_kea_dhcp6); filter(f_level_warn); destination(d_kea_dhcp6_warn); };

log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_kea_hook);      destination(d_kea_hook); };
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_bind);          destination(d_bind); };
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_pppoe);         destination(d_pppoe); };
# === PPPoE PER-SERVICE LOG PATHS START (AUTO-GENERATED) ===
log { source(s_pppoe_unified); destination(d_pppoe); destination(d_pppoe_unified); };
# === PPPoE PER-SERVICE LOG PATHS END ===
log { source(s_local); source(s_network); source(s_docker_stdout); filter(f_chrony);        destination(d_chrony); };
log { source(s_docker_stdout); filter(f_dashboard); destination(d_dashboard_access); };

filter f_messages_exclude {
    not (
        program("pppoe-server.*") or program("pppd")
        or program("kea-dhcp6") or program("kea-map-e-hook")
        or program("named") or program("bind9")
        or program("radvd")
        or program("chrony.*") or program("chronyd")
    );
};

# 2. 全体統合ログ（INFO以上は messages、WARN以上は errors.log）
log {
    source(s_local); source(s_network);
    filter(f_level_info);
    filter(f_messages_exclude);
    destination(d_messages);
};

log {
    source(s_local); source(s_network); source(s_docker_stdout);
    filter(f_level_warn);
    filter(f_not_dashboard);
    destination(d_errors);
};

# 3. Docker 全 stdout/stderr のバックアップ記録（ダッシュボードのアクセスログは除外）
log {
    source(s_docker_stdout);
    filter(f_not_dashboard);
    destination(d_docker_stdout);
};
