# /etc/syslog-ng.conf の一番上で mape.conf を読み込ませることで他のファイルへ出力されない
# @include "/etc/syslog-ng/conf.d/mape.conf" で読み込むと最下行でもう一度読み込まれてしまうので
# @include "/etc/syslog-ng/conf.d/*.conf" を一番上にする

# --- Filter の定義 (プロセス名によるフィルタリング) ---
filter f_mape_server   { program("mape-provisioning-server"); };
filter f_route_monitor { program("mape-route-monitor");       };
filter f_radvd         { program("radvd");                    };
filter f_kea_dhcp6     { program("kea-dhcp6");                };
filter f_kea_hook      { program("kea-map-e-hook");           };
filter f_bind          { program("named");                    };

# --- Destination の定義 (出力先の指定) ---
destination d_mape_server   { file("/var/log/mape-provisioning-server.log" perm(0644)); };
destination d_route_monitor { file("/var/log/mape-route-monitor.log"       perm(0644)); };
destination d_radvd         { file("/var/log/radvd.log"                    perm(0644)); };
destination d_kea_dhcp6     { file("/var/log/kea/kea-dhcp6.log"            perm(0644)); };
destination d_kea_hook      { file("/var/log/kea/kea-map-e-hook.log"       perm(0644)); };
destination d_bind          { file("/var/log/bind.log"                     perm(0644)); };

# --- Log パス (フィルタと出力先を紐付け) ---
log { source(s_src); filter(f_mape_server);   destination(d_mape_server);   flags(final); };
log { source(s_src); filter(f_route_monitor); destination(d_route_monitor); flags(final); };
log { source(s_src); filter(f_radvd);         destination(d_radvd);         flags(final); };
log { source(s_src); filter(f_kea_dhcp6);     destination(d_kea_dhcp6);     flags(final); };
log { source(s_src); filter(f_kea_hook);      destination(d_kea_hook);      flags(final); };
log { source(s_src); filter(f_bind);          destination(d_bind);          flags(final); };

