# =============================================================================
# DDNS (Dynamic DNS) Hostname Mapping Configuration (DDNS設定ファイル)
# =============================================================================
# フォーマット:
# 識別キー (VLAN番号 または MACアドレス または PPPoEユーザー名), IPv6用FQDN, IPv4用FQDN
#
# ・1列目: VLAN番号 (半角数字)、MACアドレス (12桁Hexまたはコロン区切り)、または PPPoEユーザー名
# ・2列目: IPv6用FQDN (AAAA レコード + TXT レコードが登録されます。PPPoE等は -)
# ・3列目: IPv4用FQDN (A レコード + TXT レコードが登録されます)
# ※ 未登録のクライアントは標準形式 (ce-<IPv4アドレス>.map.ocn.ad.jp) が自動適用されます。
#
# --- IPoE (MAP-E) クライアント (MACアドレス指定) ---
00:60:b9:aa:bb:cc, ix2207.v6.my.home, ix2207.v4.my.home
bc:24:11:00:11:22, openwrt.v6.my.home, openwrt.v4.my.home
00:a0:de:33:44:55, rtx1210.v6.my.home, rtx1210.v4.my.home
00:60:b9:dd:ee:ff, IX-SLAC.v6.my.home, IX-SLAC.v4.my.home

