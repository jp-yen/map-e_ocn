<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Network Interfaces</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--bg-main, #0b0f19);
      color: var(--text-main, #e2e8f0);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-strong, #fff);
    }
    .btn-refresh {
      background: var(--bg-overlay, rgba(255,255,255,0.08));
      border: 1px solid var(--border-strong, rgba(255,255,255,0.15));
      color: var(--text-strong, #fff);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
      align-content: start;
    }
    .if-card {
      background: var(--bg-panel, #111827);
      border: 1px solid var(--border-color, rgba(255,255,255,0.08));
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .if-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-faint, rgba(255,255,255,0.06));
      padding-bottom: 10px;
    }
    .if-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .badge-up {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .badge-down {
      background: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
    }
    .if-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
    }
    .detail-label {
      color: var(--text-muted, #94a3b8);
    }
    .detail-val {
      color: var(--text-soft, #f1f5f9);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-align: right;
      word-break: break-all;
    }
    .ip-tag {
      background: var(--badge-accent-bg, rgba(99, 102, 241, 0.1));
      color: var(--badge-accent-text, #818cf8);
      padding: 1px 6px;
      border-radius: 4px;
      display: block;
      width: 100%;
      margin-top: 2px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🔌</span> ネットワークインターフェース一覧 (Network Interfaces)
    </div>
    <button class="btn-refresh" onclick="fetchInterfaces()">🔄 更新</button>
  </div>

  <div class="grid" id="ifGrid">読み込み中...</div>

  <script>
    async function fetchInterfaces() {
      const grid = document.getElementById('ifGrid');
      try {
        const res = await fetch('/api/interfaces');
        const data = await res.json();
        const ifaces = data.interfaces || [];

        if (ifaces.length === 0) {
          grid.innerHTML = '<div style="color:var(--text-faint, #64748b);">インターフェース情報が取得できませんでした。</div>';
          return;
        }

        grid.innerHTML = ifaces.map(item => {
          const isUp = (item.flags || []).includes('UP');
          const mac = item.address || '-';
          const mtu = item.mtu || '-';
          const addrs = item.addr_info || [];

          const v4 = addrs.filter(a => a.family === 'inet').map(a => `${a.local}/${a.prefixlen}${a.address && a.address !== a.local ? ' peer ' + a.address : ''}`);
          const v6 = addrs.filter(a => a.family === 'inet6').map(a => `${a.local}/${a.prefixlen}`);

          return `
            <div class="if-card">
              <div class="if-header">
                <span class="if-name">${item.ifname}</span>
                <span class="badge ${isUp ? 'badge-up' : 'badge-down'}">${isUp ? 'UP' : 'DOWN'}</span>
              </div>
              <div class="if-details">
                <div class="detail-row">
                  <span class="detail-label">MAC アドレス:</span>
                  <span class="detail-val">${mac}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">MTU / 状態:</span>
                  <span class="detail-val">${mtu} / ${item.operstate || '-'}</span>
                </div>
                <div class="detail-row" style="flex-direction:column; gap:4px; margin-top:4px;">
                  <span class="detail-label">IPv4 アドレス:</span>
                  <div class="detail-val" style="text-align:left;">
                    ${v4.length ? v4.map(ip => `<div class="ip-tag">${ip}</div>`).join('') : '<span style="color:var(--text-faint, #64748b);">なし</span>'}
                  </div>
                </div>
                <div class="detail-row" style="flex-direction:column; gap:4px;">
                  <span class="detail-label">IPv6 アドレス:</span>
                  <div class="detail-val" style="text-align:left;">
                    ${v6.length ? v6.map(ip => `<div class="ip-tag">${ip}</div>`).join('') : '<span style="color:var(--text-faint, #64748b);">なし</span>'}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        grid.innerHTML = '<div style="color:var(--accent-rose, #f43f5e);">エラー: ' + e.message + '</div>';
      }
    }

    fetchInterfaces();
  </script>
  <script src="/js/bearded-themes.js"></script>
  <script src="/js/theme-manager.js"></script>
</body>
</html>
